name: python-sanitizers

# The Python suite against an ASan + UBSan build of the extension.
#
# native-tests.yml's sanitizers job (#583) watches only the code the C++ unit
# suite runs, which was 37% of the lines it compiles, and 17% of
# cvode_simulator.cpp, when this was added. It never builds _bngsim_core at all,
# so the binding layer, where #566's unchecked memcpy was, is outside it. The
# Python suite is where the engine is actually exercised: thousands of tests,
# every one of them through _bngsim_core. This job runs that suite with the
# extension, and the bngsim library linked into it, compiled under
# -fsanitize=address,undefined. A bad index anywhere on those paths then stops
# the test with a report instead of returning a wrong number.
#
# How the pieces fit:
#
#   * The flags reach CMake through SKBUILD_CMAKE_DEFINE, so pyproject.toml is
#     untouched. SuiteSparse's autobuild does not inherit them and stays
#     uninstrumented, as vendored code should.
#   * CPython is not instrumented, so the ASan runtime has to be in the process
#     before the extension loads: LD_PRELOAD on the pytest command, not on the
#     shell. PYTHONMALLOC=malloc routes Python's allocations through malloc,
#     where ASan can see them.
#   * Leak detection is off. CPython does not free everything at exit, so LSan
#     would report the interpreter, not bngsim. native-tests.yml keeps it on for
#     the C++ suite.
#   * --extra test, not dev: roadrunner and jax ship large native runtimes of
#     their own, and this job is about bngsim's. Their tests skip here.
#
# What it still cannot see: the C the codegen path writes and compiles at run
# time (cc -O3, no sanitizer flags), and anything the Python suite does not run.
#
# Two guards, because a sanitizer job is green when nothing is reported, which
# is also what a build the flags never reached reports. One checks that the
# installed extension calls into both runtimes (uv caches builds, and a cached
# plain one would otherwise pass). The other runs a known heap overflow through
# the same interpreter and environment and requires that ASan stops it.
#
# Non-blocking, like the C++ sanitizer job, until it has been green for a while.
# It runs on pull requests that touch the C++ side, nightly for everything else,
# and on demand.

on:
  pull_request:
    paths:
      - "src/**"
      - "include/**"
      - "CMakeLists.txt"
      - "cmake/**"
      - ".github/workflows/python-sanitizers.yml"
  schedule:
    - cron: "37 6 * * *"
  workflow_dispatch:

concurrency:
  group: python-sanitizers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-sanitizers:
    name: Python suite · ubuntu-latest · ASan + UBSan · ${{ matrix.shard }}/2
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: python-sanitizers-build
          save: ${{ matrix.shard == 1 }}
          max-size: 500M

      # BNGSIM_BUILD_PYTHON and BNGSIM_REQUIRE_KLU are repeated from pyproject's
      # cmake.define so this list does not depend on how scikit-build-core merges
      # the two. --reinstall-package so uv builds bngsim here rather than reusing
      # a cached plain build.
      #
      # The first run of this job ran the runner out of memory 12 minutes into
      # the build (both shards: "the runner has received a shutdown signal").
      # Ninja's default is nproc + 2 = 6 compiles at once, pybind11 adds -flto,
      # and RelWithDebInfo's -O2 -g on the ExprTk-heavy translation units under
      # ASan is the heaviest compile in the tree. So: 3 at a time, no LTO
      # (CMAKE_INTERPROCEDURAL_OPTIMIZATION=OFF is what pybind11 defers to), and
      # -g1, which keeps the line tables a report needs at a fraction of full
      # debug info. -O2 rather than ASan's suggested -O1: the suite is long, and
      # every factor of slowdown is another wall-clock guard crossed.
      - name: Build the extension under the sanitizers
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
          CMAKE_BUILD_PARALLEL_LEVEL: "3"
          SKBUILD_CMAKE_BUILD_TYPE: RelWithDebInfo
          SKBUILD_CMAKE_DEFINE: >-
            BNGSIM_BUILD_PYTHON=ON;BNGSIM_REQUIRE_KLU=ON;CMAKE_INTERPROCEDURAL_OPTIMIZATION=OFF;CMAKE_C_FLAGS_RELWITHDEBINFO=-O2 -g1 -DNDEBUG;CMAKE_CXX_FLAGS_RELWITHDEBINFO=-O2 -g1 -DNDEBUG;CMAKE_C_FLAGS=-fsanitize=address,undefined -fno-omit-frame-pointer;CMAKE_CXX_FLAGS=-fsanitize=address,undefined -fno-omit-frame-pointer;CMAKE_MODULE_LINKER_FLAGS=-fsanitize=address,undefined;CMAKE_SHARED_LINKER_FLAGS=-fsanitize=address,undefined
        run: |
          set -euxo pipefail
          uv sync --extra test --python 3.12 --reinstall-package bngsim
          ccache --show-stats

      - name: Guard against an uninstrumented extension
        run: |
          set -euo pipefail
          mod="$(find .venv -name '_bngsim_core*.so' | head -1)"
          if [ -z "$mod" ]; then
            echo "::error::No _bngsim_core extension under .venv."
            exit 1
          fi
          for sym in __asan_report_ __ubsan_handle_; do
            if ! nm -D --undefined-only "$mod" | grep -q "$sym"; then
              echo "::error::$mod makes no $sym* calls; the sanitizer flags did not reach the build."
              exit 1
            fi
          done
          echo "$mod is instrumented for ASan and UBSan."

      # The environment the suite runs in, set once for the steps that need it.
      # LD_PRELOAD goes on each python command, never into GITHUB_ENV, so uv and
      # the runner's own tools do not run with the ASan runtime loaded.
      #
      # Reports go to files (log_path), not stderr. pytest-xdist does not pass a
      # worker's stderr through, so on this job's first run with a planted bug
      # the log said only "worker 'gw3' crashed while running ..." and the report
      # that named the line was gone. Each process writes <log_path>.<pid>; the
      # last step prints them all.
      #
      # quarantine_size_mb=64 (default 256) because memory, not time, is what
      # ran out on the second full run: four workers each holding a quarantine,
      # on a 16 GB runner, beside the suite's largest stochastic ensembles.
      - name: Sanitizer runtime environment
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/san"
          {
            echo "SAN_PRELOAD=$(gcc -print-file-name=libasan.so) $(gcc -print-file-name=libubsan.so)"
            echo "SAN_LOG_DIR=$RUNNER_TEMP/san"
            echo "ASAN_OPTIONS=detect_leaks=0:abort_on_error=1:quarantine_size_mb=64:log_path=$RUNNER_TEMP/san/asan"
            echo "UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1:log_path=$RUNNER_TEMP/san/ubsan"
            echo "PYTHONMALLOC=malloc"
          } >> "$GITHUB_ENV"

      - name: Guard that ASan is live in the test interpreter
        run: |
          set -euo pipefail
          LD_PRELOAD="$SAN_PRELOAD" .venv/bin/python -c \
            "import bngsim; print('bngsim', bngsim.__version__, 'HAS_KLU', bngsim.HAS_KLU)"
          if ! LD_PRELOAD="$SAN_PRELOAD" .venv/bin/python -c "import bngsim, sys; sys.exit(0 if bngsim.HAS_KLU else 1)"; then
            echo "::error::HAS_KLU is False; the sanitized build lost KLU and the sparse paths would go unwatched."
            exit 1
          fi
          # A 128-byte read from a 64-byte heap block (64, not 8: ctypes keeps a
          # buffer of 16 bytes or less inside the object, where reading on would
          # not leave the allocation). Under this environment ASan must stop the
          # interpreter and write its report where the last step looks; if it
          # exits cleanly, or the report is not there, nothing below is watched.
          set +e
          LD_PRELOAD="$SAN_PRELOAD" .venv/bin/python -c "
          import ctypes
          src = ctypes.create_string_buffer(64)
          dst = ctypes.create_string_buffer(128)
          ctypes.memmove(dst, src, 128)
          print('read past the block and nothing stopped it')
          "
          rc=$?
          set -e
          if [ "$rc" -eq 0 ] || ! grep -qs "AddressSanitizer: heap-buffer-overflow" "$SAN_LOG_DIR"/asan.*; then
            echo "::error::A known heap overflow ran to completion (exit $rc) or left no report in $SAN_LOG_DIR; ASan is not watching the test interpreter."
            exit 1
          fi
          echo "ASan stopped the planted overflow (exit $rc) and reported it:"
          grep -h -m1 "ERROR: AddressSanitizer" "$SAN_LOG_DIR"/asan.*
          rm -f "$SAN_LOG_DIR"/*

      # Wall-clock limits first. The build here is two to three times slower than
      # python-tests.yml's, so two kinds of hang guard would fail on the
      # slowdown rather than on a hang:
      #
      #   * A timeout handed to Simulator.run (about 160 tests give one of two
      #     minutes or less). BNGSIM_TEST_TIMEOUT_SCALE stretches each by 4; see
      #     python/tests/conftest.py. The tests still run.
      #   * A test that times itself and asserts the elapsed time is under a cap.
      #     There is nothing to stretch, so those are deselected: every test
      #     that reads time.* and asserts a bound, found by walking the suite's
      #     syntax tree, not just the ones seen failing (on the first runs a 30 s
      #     cap took 47 s, a 5 s cap 5.7 s, and a 1 s cap 3.1 s).
      #
      # Also deselected here, and only here (python-tests.yml runs them all):
      #
      #   * test_nfsim_run_system_leak's throwing-run probe. It caps its own
      #     address space at 1.5 GB to make an allocation fail; ASan reserves
      #     terabytes of address space and aborts on a failed allocation instead
      #     of throwing, so the probe cannot run under it ("Failed to mmap").
      #   * test_run_tests_sh's end-to-end check, which needs the dev extra's
      #     diffrax and vivarium-core. This job installs only the test extra.
      #   * The 18 stochastic-ensemble comparisons in test_ssa_variable_volume
      #     (*_matches_extrande, *_matches_oracle). Under the sanitizers each
      #     took 4 to 8 minutes, together most of a shard, and four at once ran
      #     the runner out of memory. A sanitizer catches the same bad access on
      #     the hundredth sample as on the ten-thousandth, and the file's other
      #     21 tests run the same variable-volume paths.
      #
      # The suite is stopped with SIGINT at 80 minutes rather than by the job
      # limit, so pytest still prints which tests failed, and any single test
      # that runs past 5 minutes has every thread's stack dumped, so a hang
      # names itself.
      - name: Run the Python suite under the sanitizers (this shard)
        env:
          BNGSIM_TEST_DATA: ${{ github.workspace }}/tests/data
          BNGSIM_TEST_CACHE_DIR: ${{ runner.temp }}/bngsim-test-cache
          BNGSIM_TEST_SHARD: ${{ matrix.shard }}/2
          BNGSIM_TEST_TIMEOUT_SCALE: "4"
          DESELECT: |
            test_codegen_gen_scaling.py::test_large_model_generation_is_not_quadratic
            test_codegen_gen_scaling.py::test_function_heavy_generation_is_not_quadratic
            test_codegen_key_stream.py::test_the_key_of_a_large_model_is_cheap
            test_codegen_power_denominator.py::test_the_rewrite_finishes_fast
            test_codegen_power_denominator.py::test_a_real_derivative_prints_fast
            test_codegen_power_denominator.py::test_a_large_non_symbol_denominator_is_rejected_fast
            test_delayed_event_priority.py::test_many_idle_non_persistent_events_cost_one_pass_over_what_waits
            test_delayed_event_priority.py::test_many_waiting_executions_are_not_passed_over_at_every_stop
            test_discontinuity_stall_bound.py::test_stall_raises_quickly_instead_of_hanging
            test_discontinuity_stall_bound.py::test_raising_max_steps_does_not_reintroduce_the_hang
            test_jacobian_symbolic.py::test_many_steps_derive_at_once
            test_periodic_time_windows.py::test_a_degree_twelve_polynomial_is_solved_quickly
            test_periodic_time_windows.py::test_too_many_crossings_are_declined_loudly_and_cheaply
            test_sbml_event_chatter_biomd711.py::test_biomd711_event_chatter_does_not_stall
            test_sbml_jacobian_budget_biomd496.py::test_large_functional_build_solve_under_budget
            test_size_jump_diamond_of_rules.py::test_two_relations_over_a_diamond_load_in_linear_time
            test_size_jump_diamond_of_rules.py::test_two_roots_a_run_constant_puts_on_one_instant_over_a_diamond
            test_ssa_audit_fixes.py::test_a_tiny_propensity_beside_a_clock_trigger_does_not_hang
            test_timeout.py::test_ssa_timeout_raises_simulation_timeout
            test_timeout.py::test_rulemonkey_stateless_timeout_raises
            test_timeout.py::test_rulemonkey_session_simulate_timeout_raises
            test_timeout.py::test_nfsim_session_simulate_timeout_raises
            test_nfsim_run_system_leak.py::test_a_throwing_run_does_not_retain_the_system
            test_run_tests_sh.py::test_the_script_itself_runs_walk_up_dependent_tests_green
        run: |
          set -euxo pipefail
          deselect=()
          while read -r t; do
            [ -n "$t" ] && deselect+=(--deselect "python/tests/$t")
          done <<< "$DESELECT"
          LD_PRELOAD="$SAN_PRELOAD" timeout -s INT 80m \
            .venv/bin/python -m pytest -p no:cacheprovider python/tests \
            -n auto --dist worksteal -q --tb=short -rfE --durations=30 \
            -o faulthandler_timeout=300 "${deselect[@]}" \
            -k "not (test_ssa_variable_volume and (matches_extrande or matches_oracle))" \
            2>&1 | tee python-sanitizers-${{ matrix.shard }}.log

      # Every report, in full, whatever wrote it: an xdist worker the suite saw
      # crash, or a subprocess (python -m bngsim.cache, the codegen compiler)
      # whose test passed anyway. Any report fails the job.
      - name: Sanitizer reports
        if: always()
        run: |
          set -euo pipefail
          shopt -s nullglob
          reports=("$SAN_LOG_DIR"/*)
          if [ "${#reports[@]}" -eq 0 ]; then
            echo "No sanitizer reports in shard ${{ matrix.shard }}."
            exit 0
          fi
          for r in "${reports[@]}"; do
            echo "::group::$(basename "$r"): $(grep -m1 -hE 'ERROR: AddressSanitizer|runtime error:' "$r" || head -1 "$r")"
            cat "$r"
            echo "::endgroup::"
          done
          echo "::error::${#reports[@]} sanitizer report(s) in shard ${{ matrix.shard }}; each is above, and uploaded with the log."
          exit 1

      - name: Upload the log and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-sanitizers-${{ matrix.shard }}
          path: |
            python-sanitizers-${{ matrix.shard }}.log
            ${{ runner.temp }}/san/
          if-no-files-found: ignore
